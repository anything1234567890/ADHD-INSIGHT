<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ADHD Cognitive Portal</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body>
    <div class="glass-container">
        <header>
            <h1>Cognitive Analysis Portal</h1>
            <div id="progress-bar"><div id="progress-fill"></div></div>
        </header>

        <main id="game-container">
            <div id="start-screen">
                <p>Welcome. This assessment consists of 3 cognitive puzzles and 1 voice analysis task.</p>
                <button onclick="nextPhase()" class="btn-primary">Start Assessment</button>
            </div>
        </main>

        <div id="controls" class="hidden">
            <button id="next-btn" class="btn-primary" onclick="nextPhase()"></button>
        </div>
    </div>

    <script src="{{ url_for('static', filename='js/main.js') }}"></script>
</body>
</html>
